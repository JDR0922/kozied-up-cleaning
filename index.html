<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kozied Up Cleaning</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#1f3a2f;
  --overlay:rgba(20,35,28,0.7);
  --text:#ffffff;
  --btn:#d8c3a5;
}

body.light{
  --bg:#eef3ec;
  --overlay:rgba(255,255,255,0.6);
  --text:#1a1a1a;
  --btn:#d8c3a5;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.3s ease;
}

/* NAV */
nav{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000;
}

.logo img{
  width:50px;
  border-radius:8px;
}

/* right side */
.nav-right{
  display:flex;
  align-items:center;
  gap:12px;
}

/* toggle */
.toggle{
  width:44px;
  height:44px;
  border-radius:12px;
  background:rgba(255,255,255,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* hamburger */
.menu{
  font-size:22px;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c") center/cover no-repeat;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:var(--overlay);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:800px;
  padding:20px;
}

/* sparkle */
.sparkle{
  font-size:24px;
  margin-bottom:10px;
}

h1{
  font-family:"Playfair Display",serif;
  font-size:40px;
}

p{
  margin-top:15px;
  opacity:0.9;
}

/* buttons */
.btn{
  display:block;
  width:100%;
  max-width:320px;
  margin:12px auto;
  padding:14px;
  border-radius:16px;
  font-weight:500;
  text-decoration:none;
}

.primary{
  background:var(--btn);
  color:black;
}

.secondary{
  border:1px solid rgba(255,255,255,0.5);
  color:var(--text);
  background:transparent;
}

</style>
</head>

<body>

<nav>
  <div class="logo">
    <img src="images/logo.png">
  </div>

  <div class="nav-right">
    <div class="toggle" onclick="toggleMode()">☀️</div>
    <div class="menu">☰</div>
  </div>
</nav>

<div class="hero">
  <div class="hero-content">

    <div class="sparkle">✨</div>

    <h1>Kozied Up Cleaning</h1>

    <p>Reliable Residential & Commercial Cleaning in Edmond, OK</p>

    <a href="#contact" class="btn primary">Get Instant Quote</a>
    <a href="#contact" class="btn secondary">Book a Cleaning</a>

  </div>
</div>

<script>
function toggleMode(){
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
